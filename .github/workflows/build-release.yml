name: Build Signed APK and Release

on:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: escootercontrol-release
  cancel-in-progress: false

jobs:
  build-release:
    name: Build Signed Release
    runs-on: ubuntu-latest

    steps:
      # -------------------------------------------------------
      # Checkout
      # -------------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # -------------------------------------------------------
      # Generate changelog from the commits in this push
      # -------------------------------------------------------

      - name: Update CHANGELOG.md
        shell: bash
        run: |
          set -euo pipefail

          BEFORE="${{ github.event.before }}"
          AFTER="${{ github.sha }}"

          ENTRY="$RUNNER_TEMP/changelog-entry.md"
          NEW_CHANGELOG="$RUNNER_TEMP/CHANGELOG.md"
          RELEASE_NOTES="$RUNNER_TEMP/release-notes.md"

          DATE="$(date -u '+%Y-%m-%d %H:%M UTC')"

          {
            echo "## $DATE"
            echo ""
          } > "$ENTRY"

          if [[ "$BEFORE" == "0000000000000000000000000000000000000000" ]]; then
            COMMITS="$AFTER"
          else
            COMMITS="$(git rev-list --reverse "$BEFORE..$AFTER")"
          fi

          while IFS= read -r SHA; do
            [[ -z "$SHA" ]] && continue

            TITLE="$(git log -1 --format=%s "$SHA")"
            BODY="$(git log -1 --format=%b "$SHA")"
            SHORT_SHA="$(git rev-parse --short "$SHA")"

            echo "### $TITLE" >> "$ENTRY"
            echo "" >> "$ENTRY"
            echo "\`$SHORT_SHA\`" >> "$ENTRY"
            echo "" >> "$ENTRY"

            if [[ -n "${BODY//[[:space:]]/}" ]]; then
              printf '%s\n' "$BODY" >> "$ENTRY"
            else
              echo "_No additional description._" >> "$ENTRY"
            fi

            echo "" >> "$ENTRY"
          done <<< "$COMMITS"

          cp "$ENTRY" "$RELEASE_NOTES"

          {
            echo "# Changelog"
            echo ""
            cat "$ENTRY"

            if [[ -s CHANGELOG.md ]]; then
              sed '1{/^# Changelog$/d;}' CHANGELOG.md |
                sed '1{/^$/d;}'
            fi
          } > "$NEW_CHANGELOG"

          mv "$NEW_CHANGELOG" CHANGELOG.md

          echo "RELEASE_NOTES=$RELEASE_NOTES" >> "$GITHUB_ENV"

      # -------------------------------------------------------
      # Commit changelog AS DevCatSon
      # -------------------------------------------------------

      - name: Commit changelog
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "DevCatSon"
          git config user.email "337869644+DevCatSon@users.noreply.github.com"

          git add CHANGELOG.md

          if git diff --cached --quiet; then
            echo "No changelog changes."
          else
            git commit -m "docs: update changelog for ${GITHUB_SHA::7}"
            git push origin HEAD:main
          fi

          echo "RELEASE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      # -------------------------------------------------------
      # Java / Gradle
      # -------------------------------------------------------

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle executable
        run: chmod +x gradlew

      # -------------------------------------------------------
      # Restore YOUR Android signing key
      # -------------------------------------------------------

      - name: Restore signing keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail

          echo "$KEYSTORE_BASE64" |
            base64 --decode \
            > "$RUNNER_TEMP/EscooterControl-release.jks"

      # -------------------------------------------------------
      # Your Gradle project already reads app/keystore.properties
      # -------------------------------------------------------

      - name: Create signing properties
        shell: bash
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          printf '%s\n' \
            "storeFile=$RUNNER_TEMP/EscooterControl-release.jks" \
            "storePassword=$STORE_PASSWORD" \
            "keyAlias=$KEY_ALIAS" \
            "keyPassword=$KEY_PASSWORD" \
            > app/keystore.properties

      # -------------------------------------------------------
      # Build
      # -------------------------------------------------------

      - name: Run tests
        run: ./gradlew --no-daemon test

      - name: Build signed release APK
        run: ./gradlew --no-daemon assembleRelease

      # -------------------------------------------------------
      # Locate and rename APK
      # -------------------------------------------------------

      - name: Prepare APK
        shell: bash
        run: |
          set -euo pipefail

          APK="$(find app/build/outputs/apk/release \
            -type f \
            -name '*.apk' \
            ! -name '*unsigned*' \
            | head -n 1)"

          if [[ -z "$APK" ]]; then
            echo "Signed release APK could not be found."
            exit 1
          fi

          SHORT_SHA="${GITHUB_SHA::7}"
          OUTPUT="EscooterControl-${SHORT_SHA}.apk"

          cp "$APK" "$OUTPUT"

          echo "APK_FILE=$OUTPUT" >> "$GITHUB_ENV"
          echo "SHORT_SHA=$SHORT_SHA" >> "$GITHUB_ENV"

      # -------------------------------------------------------
      # Also keep it as an Actions artifact
      # -------------------------------------------------------

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: EscooterControl-${{ env.SHORT_SHA }}
          path: ${{ env.APK_FILE }}

      # -------------------------------------------------------
      # Publish NORMAL stable GitHub Release and mark Latest
      # -------------------------------------------------------

      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          TAG="build-${GITHUB_RUN_NUMBER}-${SHORT_SHA}"

          COMMIT_TITLE="$(git log -1 --format=%s "$GITHUB_SHA")"

          gh release create "$TAG" \
            "$APK_FILE#Signed APK" \
            --target "$RELEASE_SHA" \
            --title "EscooterControl Build #${GITHUB_RUN_NUMBER} - ${COMMIT_TITLE}" \
            --notes-file "$RELEASE_NOTES" \
            --latest
